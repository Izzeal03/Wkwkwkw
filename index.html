<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Ucapan Buat Dede</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      text-align: center;
      padding: 50px;
    }
    h1 {
      font-size: 3em;
      color: #fff;
      text-shadow: 2px 2px 5px rgba(0,0,0,0.3);
      animation: glow 2s infinite alternate;
    }
    @keyframes glow {
      from { text-shadow: 0 0 10px #fff, 0 0 20px #ff6b6b; }
      to   { text-shadow: 0 0 20px #fff, 0 0 30px #ff6b6b; }
    }
    p {
      font-size: 1.5em;
      color: #333;
      margin-top: 20px;
    }
    .heart {
      font-size: 4em;
      color: red;
      animation: beat 1s infinite;
    }
    @keyframes beat {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.3); }
    }
  </style>
</head>
<body>
  <h1>DEDE JELEK PESEK 🤭</h1>
  <p>Hehe, jangan marah ya... ini cuma ucapan bercanda ✨</p>
  <div class="heart">❤️</div>
  <p>Dari sahabatmu yang iseng 😅</p>
</body>
</html>
